<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roundtable — Add Answer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Sora', Arial, Helvetica, sans-serif; font-weight: 500;
      background: #f4f4f6; padding: 35px; max-width: 840px; margin-left: auto; margin-right: auto;
    }
    h1 { font-size: 35px; margin: 28px 0; font-weight: 700; }
    label { display: block; font-size: 21px; color: #666; margin-bottom: 7px; margin-top: 21px; }
    .cats { display: flex; gap: 14px; }
    .cat-btn {
      flex: 1; padding: 25px 11px; border-radius: 18px; border: 5px solid transparent;
      font-size: 25px; font-weight: 700; font-family: inherit; cursor: pointer; text-align: center; color: #111;
    }
    .cat-btn[data-cat="challenge"] { background: #ED99A1; }
    .cat-btn[data-cat="experience"] { background: #FFFF66; }
    .cat-btn[data-cat="message"] { background: #0016C4; color: #fff; }
    .cat-btn.selected { border-color: #000; }
    input[type="text"], textarea {
      width: 100%; font-size: 30px; padding: 21px; border-radius: 18px;
      border: 1px solid #ccc; font-family: inherit; font-weight: 500;
    }
    textarea { min-height: 158px; resize: vertical; }
    #editBanner {
      display: none; align-items: center; justify-content: space-between; background: #fff3cd;
      border: 1px solid #ffe08a; border-radius: 14px; padding: 14px 21px; margin-top: 25px; font-size: 23px;
    }
    #editBanner button {
      border: none; background: #333; color: #fff; border-radius: 11px; padding: 9px 18px;
      font-size: 21px; font-family: inherit; font-weight: 700; cursor: pointer;
    }
    button#addBtn {
      width: 100%; margin-top: 21px; padding: 28px; font-size: 32px; font-weight: 700;
      background: #000131; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-family: inherit;
    }
    button#addBtn:active { opacity: 0.8; }
    button#addBtn:disabled { opacity: 0.5; }
    #savedMsg { color: #2a7; font-size: 23px; height: 28px; margin-top: 11px; }

    #manage { margin-top: 46px; }
    #manage h3 { font-size: 23px; color: #666; text-transform: uppercase; letter-spacing: .9px; }
    .manageItem {
      background: #fff; border-radius: 14px; padding: 18px 21px; margin-bottom: 11px;
      border-left: 9px solid #ccc; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    }
    .manageItem.challenge { border-left-color: #ED99A1; }
    .manageItem.experience { border-left-color: #FFFF66; }
    .manageItem.message { border-left-color: #0016C4; }
    .manageItem .content { flex: 1; min-width: 0; }
    .manageItem .org { font-weight: 700; font-size: 21px; color: #555; }
    .manageItem .txt { font-size: 25px; margin-top: 4px; word-wrap: break-word; font-weight: 500; }
    .manageItem .actions { display: flex; flex-direction: column; gap: 11px; flex-shrink: 0; }
    .manageItem button {
      border: none; background: #eee; border-radius: 11px; padding: 9px 18px;
      font-size: 21px; font-family: inherit; font-weight: 700; cursor: pointer;
    }
    .manageItem button.delete { background: #fde2e2; color: #a11; }
  </style>
</head>
<body>
  <h1>Add an answer</h1>

  <label>Category</label>
  <div class="cats">
    <button class="cat-btn" data-cat="challenge">Challenge</button>
    <button class="cat-btn" data-cat="experience">Experience</button>
    <button class="cat-btn" data-cat="message">Message</button>
  </div>

  <label>Organisation</label>
  <input type="text" id="org" list="orgList" placeholder="Start typing…" autocomplete="off">
  <datalist id="orgList"></datalist>

  <label>Answer</label>
  <textarea id="text" placeholder="Type what they just said…"></textarea>

  <div id="editBanner">
    <span>Editing an existing entry</span>
    <button id="cancelBtn">Cancel</button>
  </div>

  <button id="addBtn">Add to board</button>
  <div id="savedMsg"></div>

  <div id="manage">
    <h3>All entries — tap to edit or delete</h3>
    <div id="manageList"></div>
  </div>

  <script>
    // Google Apps Script backend — unchanged.
    var API_URL = 'https://script.google.com/macros/s/AKfycbyy1BBFFk2C5MpczmJSP7p6wIu2haaKT7rvEowsgMfXq4wHNTp4_YpG_1OVCyETRhm26A/exec';

    var selectedCat = 'challenge';
    var editingId = null;
    var allEntries = [];

    var buttons = document.querySelectorAll('.cat-btn');
    buttons.forEach(function (b) {
      b.onclick = function () { setCategory(b.getAttribute('data-cat')); };
    });
    buttons[0].classList.add('selected');

    function setCategory(cat) {
      selectedCat = cat;
      buttons.forEach(function (x) { x.classList.toggle('selected', x.getAttribute('data-cat') === cat); });
    }

    var textEl = document.getElementById('text');
    var orgEl = document.getElementById('org');
    var addBtn = document.getElementById('addBtn');
    var editBanner = document.getElementById('editBanner');
    document.getElementById('cancelBtn').onclick = cancelEdit;

    function startEdit(entry) {
      editingId = entry.id;
      setCategory(entry.category);
      orgEl.value = entry.org || '';
      textEl.value = entry.text;
      addBtn.textContent = 'Save changes';
      editBanner.style.display = 'flex';
      textEl.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      orgEl.value = '';
      textEl.value = '';
      addBtn.textContent = 'Add to board';
      editBanner.style.display = 'none';
    }

    function submitForm() {
      var text = textEl.value.trim();
      if (!text) return;
      var org = orgEl.value.trim();
      addBtn.disabled = true;

      var isEdit = !!editingId;
      var url = API_URL + '?action=' + (isEdit ? 'edit' : 'add')
        + '&category=' + encodeURIComponent(selectedCat)
        + '&org=' + encodeURIComponent(org)
        + '&text=' + encodeURIComponent(text)
        + (isEdit ? '&id=' + encodeURIComponent(editingId) : '');

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function () {
          addBtn.disabled = false;
          if (isEdit) {
            cancelEdit();
          } else {
            document.getElementById('savedMsg').textContent = 'Added ✓';
            setTimeout(function () { document.getElementById('savedMsg').textContent = ''; }, 1200);
            textEl.value = '';
            textEl.focus();
          }
          loadEntries();
        })
        .catch(function () {
          addBtn.disabled = false;
          alert('Could not save, try again.');
        });
    }

    function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      fetch(API_URL + '?action=delete&id=' + encodeURIComponent(id))
        .then(loadEntries)
        .catch(function () {});
    }

    function renderManage() {
      var el = document.getElementById('manageList');
      el.innerHTML = '';
      var items = allEntries.slice().reverse(); // newest first, easiest to find recent mistakes
      items.forEach(function (entry) {
        var row = document.createElement('div');
        row.className = 'manageItem ' + entry.category;

        var content = document.createElement('div');
        content.className = 'content';
        var org = document.createElement('div');
        org.className = 'org';
        org.textContent = entry.org || '(no organisation)';
        var txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = entry.text;
        content.appendChild(org);
        content.appendChild(txt);

        var actions = document.createElement('div');
        actions.className = 'actions';
        var editB = document.createElement('button');
        editB.textContent = 'Edit';
        editB.onclick = function () { startEdit(entry); };
        var delB = document.createElement('button');
        delB.className = 'delete';
        delB.textContent = 'Delete';
        delB.onclick = function () { deleteEntry(entry.id); };
        actions.appendChild(editB);
        actions.appendChild(delB);

        row.appendChild(content);
        row.appendChild(actions);
        el.appendChild(row);
      });
    }

    function renderOrgList() {
      var names = {};
      allEntries.forEach(function (e) { if (e.org) names[e.org] = true; });
      var dl = document.getElementById('orgList');
      dl.innerHTML = '';
      Object.keys(names).sort().forEach(function (name) {
        var opt = document.createElement('option');
        opt.value = name;
        dl.appendChild(opt);
      });
    }

    function loadEntries() {
      fetch(API_URL + '?action=list')
        .then(function (r) { return r.json(); })
        .then(function (entries) {
          allEntries = entries;
          renderManage();
          renderOrgList();
        })
        .catch(function () {});
    }

    addBtn.onclick = submitForm;
    textEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitForm();
      }
    });

    loadEntries();
    setInterval(loadEntries, 5000);
  </script>
</body>
</html>
